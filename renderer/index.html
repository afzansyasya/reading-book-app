<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>iMybook App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" />
</head>

<body> 
  <h1>Book Search</h1>
  <input type="text" id="bookTitle" placeholder="Enter book title..." />
  <button id="searchBtn">Search</button>
  <div id="result"></div>
  <button id="listBtn" style="display:none;">Add to Read List</button>
  <div id="recommendations"></div>
  <section id="readlistSection">
    <h1>My Read List</h1>
    <div id="readListBooks"></div>
  </section>
  <script src="index.js"></script>
</body>

</html>
